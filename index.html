<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mi primera página web</title>
  </head>
  <body
    style="margin: 0; font-family: Arial, Helvetica, sans-serif; color: #14213d"
  >
    <header style="background-color: #eee4f5; padding: 40px 8%">
      <div
        style="
          display: flex;
          justify-content: space-between;
          align-items: center;
        "
      >
        <h1>Mi primera web</h1>
        <nav>
          <a
            href="#Primero"
            style="color: #0ba879; margin-right: 15px; text-decoration: none"
          >
            Inicio
          </a>
          <a
            href="#Segundo"
            style="margin-right: 15px; color: #0ba879; text-decoration: none"
            >Sobre mí</a
          ><a
            href="#Tercero"
            style="margin-right: 15px; color: #0ba879; text-decoration: none"
          >
            Proyectos </a
          ><a
            href="#Contacto"
            style="margin-right: 15px; color: #0ba879; text-decoration: none"

            Contacto
          </a>
        </nav>
      </div>
    </header>

    <main style="padding: 8%">
      <section style="display: flex; align-items: center; gap: 40">
        <div style="width: 50%">
          <h2>Bienvenida a mi primera web</h2>
          <p>Esta web es para practicar algunas etiquetas html</p>
          <a
            href="#"
            style="
              display: inline-block;
              background-color: #14213d;
              color: #0ba879;
              padding: 15px 25px;
              border-radius: 28px;
              text-decoration: none;
            "
            >Saber más
          </a>
        </div>
        <div style="width: 50%">
          <img
            src="2773.png"
            ;
            alt="dibujo ordenador y teclado"
            style="width: 100%; border-radius: 12px"
          />
        </div>
      </section>
      <section>
        <article
          id="Primero"
          style="
            width: 90%;
            background-color: #14213d;
            padding: 25px;
            margin-top: 25px;
            border-radius: 12px;
            margin-right: 10px;
          "
        >
          <h2 style="color: #0ba879">Primero</h2>
        </article>
        <p>Esto es un parrafo de prueba</p>
        <article
          id="Segundo"
          style="
            width: 50%;
            background-color: #14213d;
            padding: 25px;
            margin-top: 25px;
            border-radius: 12px;
            margin-right: 10px;
          "
        >
          <h2 style="color: #0ba879">Segundo</h2>
        </article>
        <p>Esto es un parrafo de prueba</p>
        <article
          id="Tercero"
          style="
            width: 30%;
            background-color: #14213d;
            padding: 25px;
            margin-top: 25px;
            border-radius: 12px;
          "
        >
          <h2 style="color: #0ba879">Tercero</h2>
        </article>
        <p>Esto es un parrafo de prueba</p>
      </section>
